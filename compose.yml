services:
  webproxy:
    image: ghcr.io/mmbesar/webproxy:latest
    container_name: webproxy
    restart: unless-stopped
    environment:
      # --- Web proxy page (URL box). No password, for a trusted home network.
      RH_ALLOW_OPEN: "true"
      PUBLIC_PORT: 8080
      PUBLIC_CROSS_PORT: 8081
      # --- Forward proxy: point a device's own browser at SERVER_IP:3128 (best for YouTube & heavy sites).
      FORWARD_PROXY_PORT: 3128
      # FORWARD_ALLOW: "192.168.1.0/24"      # who may use it (default: all private networks)
      # FORWARD_AUTH: "user:password"        # optional login
      # FORWARD_LOG: "true"                  # log every site opened through it
      # QUICK_LINKS: "Google=https://www.google.com, DuckDuckGo=https://duckduckgo.com, YouTube=https://www.youtube.com, Facebook=https://www.facebook.com"
    ports:
      - "8080:8080"
      - "8081:8081"
      - "3128:3128"
    volumes:
      - sessions:/app/sessions
      - cache-js:/app/cache-js

volumes:
  sessions:
  cache-js:

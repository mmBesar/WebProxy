services:
  webproxy:
    image: ghcr.io/mmbesar/webproxy:latest
    container_name: webproxy
    restart: unless-stopped
    environment:
      # Home-network mode: no password, no session screens.
      RH_ALLOW_OPEN: "true"
      # Or use a password instead (remove RH_ALLOW_OPEN):
      # RH_PASSWORD: change-me
      # Ports the BROWSER uses (must equal the host side of "ports:" below):
      PUBLIC_PORT: 8080
      PUBLIC_CROSS_PORT: 8081
      PUBLIC_PROTOCOL: "http:"
      # LOG_LEVEL: traffic   # only for debugging; logs every proxied URL
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - sessions:/app/sessions
      - cache-js:/app/cache-js

volumes:
  sessions:
  cache-js:

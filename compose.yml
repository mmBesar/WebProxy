services:
  webproxy:
    image: ghcr.io/mmbesar/webproxy:latest
    container_name: webproxy
    restart: unless-stopped
    depends_on:
      - pot-provider
    environment:
      # Home-network mode: no password, no session screens.
      RH_ALLOW_OPEN: "true"
      # Ports the BROWSER uses (must equal the host side of "ports:" below):
      PUBLIC_PORT: 8080
      PUBLIC_CROSS_PORT: 8081
      # YouTube fix: mints PO tokens through the pot-provider service below.
      POT_URL: http://pot-provider:4416
      # Quick-link buttons on the landing page (Name=url, comma or new-line separated).
      # QUICK_LINKS: "Google=https://www.google.com, DuckDuckGo=https://duckduckgo.com, YouTube=https://www.youtube.com, Facebook=https://www.facebook.com"
      # Debugging only: shows YouTube's verdict per stream request (sps=OK / PENDING / REJECTED)
      # LOG_STATUS: "true"
      # LOG_STATUS_MATCH: "googlevideo"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - sessions:/app/sessions
      - cache-js:/app/cache-js

  # Mints the tokens YouTube demands (BotGuard). Never publish its port: it has no authentication.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    container_name: pot-provider
    restart: unless-stopped
    init: true

volumes:
  sessions:
  cache-js:

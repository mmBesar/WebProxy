<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>WebProxy</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root {
    --base:#24273a; --mantle:#1e2030; --crust:#181926;
    --surface0:#363a4f; --surface1:#494d64;
    --text:#cad3f5; --subtext0:#a5adcb; --overlay0:#6e738d;
    --mauve:#c6a0f6; --pink:#f5bde6; --red:#ed8796;
}
* { box-sizing: border-box; }
html, body { margin:0; min-height:100%; background:var(--base); color:var(--text);
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width:640px; margin:0 auto; padding:12vh 20px 40px; }
h1 { margin:0 0 6px; font-size:2rem; color:var(--mauve); letter-spacing:.5px; }
p.sub { margin:0 0 28px; color:var(--subtext0); }
form { display:flex; gap:8px; }
input[type=text] { flex:1; min-width:0; padding:14px 16px; font-size:1rem; color:var(--text);
    background:var(--mantle); border:1px solid var(--surface1); border-radius:10px;
    font-family:"IBM Plex Mono", ui-monospace, monospace; }
input[type=text]:focus { outline:none; border-color:var(--mauve); box-shadow:0 0 0 3px rgba(198,160,246,.25); }
input::placeholder { color:var(--overlay0); }
button { cursor:pointer; border:0; border-radius:10px; font-size:1rem; font-weight:600; font-family:inherit; }
#go { padding:0 22px; background:var(--mauve); color:var(--crust); }
#go:hover { background:var(--pink); }
#go:disabled { opacity:.6; cursor:wait; }
#pwrow { display:none; margin-bottom:10px; }
#pwrow input { width:100%; }
.quick { display:flex; flex-wrap:wrap; gap:8px; margin-top:22px; }
.quick button { padding:8px 14px; font-size:.9rem; font-weight:500; background:var(--surface0); color:var(--text); }
.quick button:hover { background:var(--surface1); }
#err { display:none; margin-top:18px; padding:12px 14px; border-radius:10px; color:var(--red);
    background:var(--mantle); border:1px solid var(--surface1); word-break:break-word; }
footer { margin-top:36px; color:var(--overlay0); font-size:.85rem; }
</style>
</head>
<body>
<main>
    <h1>WebProxy</h1>
    <p class="sub">Type a web address or a search and go.</p>

    <div id="pwrow"><input type="password" id="pw" placeholder="Password" autocomplete="current-password"></div>

    <form id="f" autocomplete="off">
        <input type="text" id="url" placeholder="youtube.com or search terms"
               autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"
               inputmode="url" enterkeyhint="go" autofocus>
        <button type="submit" id="go">Go</button>
    </form>

    <div class="quick" id="quick"></div>
    <div id="err" role="alert"></div>
    <footer>Pages are fetched by this server and shown here.</footer>
</main>

<script>
(function () {
    var KEY = 'webproxy_session', PWKEY = 'webproxy_pwd';
    var SITES = [
        ['DuckDuckGo', 'https://duckduckgo.com/'], ['Google', 'https://www.google.com/'],
        ['YouTube', 'https://www.youtube.com/'], ['Wikipedia', 'https://www.wikipedia.org/'],
        ['Reddit', 'https://www.reddit.com/'], ['Twitch', 'https://www.twitch.tv/']
    ];
    var $ = function (id) { return document.getElementById(id); };
    var needPassword = false;

    function showError(msg) {
        var e = $('err');
        e.style.display = msg ? 'block' : 'none';
        e.textContent = msg || '';
    }

    // Turn whatever was typed into a proper URL (fixes "Https://", bare domains, searches).
    function normalize(raw) {
        var v = (raw || '').trim();
        if (!v) return null;
        var m = v.match(/^([a-z][a-z0-9+.-]*):\/\//i);
        if (m) return m[1].toLowerCase() + v.slice(m[1].length);
        if (/^(localhost|\d{1,3}(\.\d{1,3}){3})(:\d+)?([\/?#].*)?$/i.test(v)) return 'http://' + v;
        if (/^[^\s\/?#]+\.[^\s\/?#]{2,}([\/?#]\S*)?$/.test(v)) return 'https://' + v;
        return 'https://duckduckgo.com/?q=' + encodeURIComponent(v);
    }

    function api(path) {
        if (needPassword) {
            var pwd = $('pw').value || localStorage.getItem(PWKEY) || '';
            path += (path.indexOf('?') >= 0 ? '&' : '?') + 'pwd=' + encodeURIComponent(pwd);
        }
        return fetch(path).then(function (r) {
            if (r.status === 403) throw new Error('Wrong password.');
            if (!r.ok) throw new Error('Server answered ' + r.status + '.');
            return r.text();
        });
    }

    function ensureSession() {
        var id = localStorage.getItem(KEY);
        var check = id ? api('/sessionexists?id=' + encodeURIComponent(id)) : Promise.resolve('not found');
        return check.then(function (res) {
            if (id && res === 'exists') return id;
            return api('/newsession').then(function (newId) {
                newId = newId.trim();
                if (!/^[0-9a-f]{32}$/i.test(newId)) throw new Error('Unexpected session id from server.');
                return api('/editsession?id=' + encodeURIComponent(newId) + '&enableShuffling=0').then(function () {
                    localStorage.setItem(KEY, newId);
                    return newId;
                });
            });
        });
    }

    function navigate(u) { (window.__navigate || function (x) { window.location.href = x; })(u); }

    function go(raw) {
        showError();
        var target = normalize(raw);
        if (!target) return;
        $('go').disabled = true;
        ensureSession().then(function (id) {
            if (needPassword) localStorage.setItem(PWKEY, $('pw').value || localStorage.getItem(PWKEY) || '');
            navigate('/' + id + '/' + target);
        }).catch(function (e) {
            showError(e.message || String(e));
        }).then(function () { $('go').disabled = false; });
    }

    SITES.forEach(function (s) {
        var b = document.createElement('button');
        b.type = 'button'; b.textContent = s[0];
        b.onclick = function () { go(s[1]); };
        $('quick').appendChild(b);
    });
    $('f').onsubmit = function (ev) { ev.preventDefault(); go($('url').value); };
    window.__normalize = normalize;

    fetch('/needpassword').then(function (r) { return r.text(); }).then(function (t) {
        needPassword = t === 'true';
        if (needPassword) {
            $('pwrow').style.display = 'block';
            $('pw').value = localStorage.getItem(PWKEY) || '';
        }
    }).catch(function () {});
})();
</script>
</body>
</html>
